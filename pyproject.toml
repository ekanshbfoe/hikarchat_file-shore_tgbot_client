[project]
name = "file-store-bot"
version = "1.0.0"
description = "Telegram file store bot with multi-platform force subscribe"
requires-python = ">=3.13"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp==3.14.5",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "pillow==13.0.0",
    "pydantic-settings==2.16.2",
    "rapidfuzz==3.14.6",
    "sqlalchemy[asyncio]==2.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-aiohttp==1.1.1",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
